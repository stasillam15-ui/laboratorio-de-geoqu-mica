// Función para calcular los Controles de Calidad (QC) según la regla escalonada del usuario
const calcularQCEscalonado = (muestras) => {
  if (muestras <= 0) return 0;
  // Menos o igual a 10 muestras -> 3 QC
  // 11 a 20 -> 4 QC
  // 21 a 30 -> 5 QC
  // 31 a 40 -> 6 QC... etc.
  return Math.floor((muestras - 1) / 10) + 3;
};

  // Estado del planificador / simulador dinámico por MUESTRAS (comerciales/reales)
  const [simMetalesSamples, setSimMetalesSamples] = useState(0); 
  const [simOroPlataSamples, setSimOroPlataSamples] = useState(0); 
  const [simAguasAcuosasSamples, setSimAguasAcuosasSamples] = useState(0); 
  const [simAguasNoAcuosasSamples, setSimAguasNoAcuosasSamples] = useState(0);

    ];
  });

  useEffect(() => {
    localStorage.setItem('geo_history', JSON.stringify(history));
  }, [history]);

  // Formulario para registrar muestras reales
  const [formMethod, setFormMethod] = useState("Metales Suelo");
  const [formDate, setFormDate] = useState(new Date().toISOString().split('T')[0]);
  const [formSamples, setFormSamples] = useState(10);
  const [isCustomConsumption, setIsCustomConsumption] = useState(false);
  const [customHno3, setCustomHno3] = useState(0);
  const [customHcl, setCustomHcl] = useState(0);
  const [customH2o2, setCustomH2o2] = useState(0);
  const [formNotes, setFormNotes] = useState("");
  const [notification, setNotification] = useState(null);

  // Formulario Preparación de Soluciones
  const [registroGastoModo, setRegistroGastoModo] = useState('corrida');
  const [solFecha, setSolFecha] = useState(new Date().toISOString().split('T')[0]);
  const [solReactivo, setSolReactivo] = useState("");
  const [solVolumen, setSolVolumen] = useState(100);

  // Formulario de ingreso de nuevo reactivo al inventario
  const [newReagentName, setNewReagentName] = useState("Ácido Nitrico");
  const [newReagentCode, setNewReagentCode] = useState("RQ-NEW-GEO");
  const [newReagentBrand, setNewReagentBrand] = useState("Spectrum");
  const [newReagentLot, setNewReagentLot] = useState("");
  const [newReagentExpiry, setNewReagentExpiry] = useState("2028-12-31");
  const [newReagentVol, setNewReagentVol] = useState(1000);
  const [newReagentQty, setNewReagentQty] = useState(1);

  // --- Estado de Ocupación de Laboratorio ---
  const [registrosLaboratorio, setRegistrosLaboratorio] = useState(() => {
    const saved = localStorage.getItem('geo_ocupacion');
    if (saved) return JSON.parse(saved);
    return [
      { id: 1, docente: "Dr. Wilder Chuquiruna", curso: "Geoestadística", fecha: "2026-08-03", horas: 6 },
      { id: 2, docente: "M.Sc. Sandra Medina Paredes", curso: "Química Analítica", fecha: "2026-08-04", horas: 4 }

  });

  useEffect(() => {
    localStorage.setItem('geo_ocupacion', JSON.stringify(registrosLaboratorio));
  }, [registrosLaboratorio]);
  const [isOcupacionModalOpen, setIsOcupacionModalOpen] = useState(false);
  const [ocDocente, setOcDocente] = useState("");
  const [ocCurso, setOcCurso] = useState("");
  const [ocFecha, setOcFecha] = useState(new Date().toISOString().split('T')[0]);
  const [ocHoras, setOcHoras] = useState(1);

  // 1. CÁLCULO DE STOCK DISPONIBLE NETO ACTUAL VIGENTE
  const stockDisponible = useMemo(() => {
    const totals = { "Ácido Nitrico": 0, "Ácido clorhídrico": 0, "Peróxido de hidrógeno 30%": 0 };
    inventario.forEach(item => {
      if (item.state === "Vigente") {
        if (item.name === "Ácido Nitrico") totals["Ácido Nitrico"] += item.currentVol;
        if (item.name === "Ácido clorhídrico") totals["Ácido clorhídrico"] += item.currentVol;
        if (item.name === "Peróxido de hidrógeno 30%") totals["Peróxido de hidrógeno 30%"] += item.currentVol;
      }
    });
    return totals;
  }, [inventario]);

  // QC Calculados para cada deslizador del planificador
  const simMetalesQC = useMemo(() => calcularQCEscalonado(simMetalesSamples), [simMetalesSamples]);
  const simOroPlataQC = useMemo(() => calcularQCEscalonado(simOroPlataSamples), [simOroPlataSamples]);
  const simAguasAcuosasQC = useMemo(() => calcularQCEscalonado(simAguasAcuosasSamples), [simAguasAcuosasSamples]);
  const simAguasNoAcuosasQC = useMemo(() => calcularQCEscalonado(simAguasNoAcuosasSamples), [simAguasNoAcuosasSamples]);

  // Total de análisis individuales (Muestras + QC) en simulación
  const simMetalesTotal = simMetalesSamples + simMetalesQC;
  const simOroPlataTotal = simOroPlataSamples + simOroPlataQC;
  const simAguasAcuosasTotal = simAguasAcuosasSamples + simAguasAcuosasQC;
  const simAguasNoAcuosasTotal = simAguasNoAcuosasSamples + simAguasNoAcuosasQC;

  // 2. CÁLCULO DE CONSUMO DE LA SIMULACIÓN ACTUAL (PLANIFICADOR)
  const consumoSimulado = useMemo(() => {
    let hno3 = 0;
    let hcl = 0;
    let h2o2 = 0;

    // Metales Suelo
    hno3 += simMetalesTotal * METODOS_DICCIONARIO["Metales Suelo"].con_hno3;
    hcl += simMetalesTotal * METODOS_DICCIONARIO["Metales Suelo"].con_hcl;
    h2o2 += simMetalesTotal * METODOS_DICCIONARIO["Metales Suelo"].con_h2o2;

    // Oro y Plata
    hno3 += simOroPlataTotal * METODOS_DICCIONARIO["Oro y Plata"].con_hno3;
    hcl += simOroPlataTotal * METODOS_DICCIONARIO["Oro y Plata"].con_hcl;
    h2o2 += simOroPlataTotal * METODOS_DICCIONARIO["Oro y Plata"].con_h2o2;

    // Aguas Acuosas
    hno3 += simAguasAcuosasTotal * METODOS_DICCIONARIO["Aguas Acuosas"].con_hno3;
    hcl += simAguasAcuosasTotal * METODOS_DICCIONARIO["Aguas Acuosas"].con_hcl;
    h2o2 += simAguasAcuosasTotal * METODOS_DICCIONARIO["Aguas Acuosas"].con_h2o2;

    // Aguas no Acuosas
    hno3 += simAguasNoAcuosasTotal * METODOS_DICCIONARIO["Aguas no Acuosas"].con_hno3;
    hcl += simAguasNoAcuosasTotal * METODOS_DICCIONARIO["Aguas no Acuosas"].con_hcl;
    h2o2 += simAguasNoAcuosasTotal * METODOS_DICCIONARIO["Aguas no Acuosas"].con_h2o2;

    return { hno3, hcl, h2o2 };
  }, [simMetalesTotal, simOroPlataTotal, simAguasAcuosasTotal, simAguasNoAcuosasTotal]);

  // Calcular cantidad de muestras adicionales máximas que pueden procesarse con un stock de reactivos determinado
  const calcularMaxMuestrasPosibles = (stock, metodo) => {
    const def = METODOS_DICCIONARIO[metodo];
    const limites = [];
    if (def.con_hno3 > 0) limites.push(stock["Ácido Nitrico"] / def.con_hno3);
    if (def.con_hcl > 0) limites.push(stock["Ácido clorhídrico"] / def.con_hcl);
    if (def.con_h2o2 > 0) limites.push(stock["Peróxido de hidrógeno 30%"] / def.con_h2o2);
    
    const maxTotalTests = limites.length > 0 ? Math.floor(Math.min(...limites)) : 0;
    if (maxTotalTests <= 0) return { muestras: 0, qc: 0, total: 0 };

    // Encontramos el número máximo de muestras reales que junto con sus QC no superan maxTotalTests
    let bestSamples = 0;
    let bestQC = 0;
    for (let s = 1; s <= maxTotalTests; s++) {
      const qc = calcularQCEscalonado(s);
      if (s + qc <= maxTotalTests) {
        bestSamples = s;
        bestQC = qc;
      } else {
        break;
      }
    }
    return {
      muestras: bestSamples,
      qc: bestQC,
      total: bestSamples + bestQC
    };
  };

  // 3. AUTONOMÍA EXCLUSIVA MÁXIMA DE CADA MÉTODO CON EL STOCK DISPONIBLE ACTUAL
  const autonomiaExclusiva = useMemo(() => {
    return {
      metales: calcularMaxMuestrasPosibles(stockDisponible, "Metales Suelo"),
      oroPlata: calcularMaxMuestrasPosibles(stockDisponible, "Oro y Plata"),
      aguasAcuosas: calcularMaxMuestrasPosibles(stockDisponible, "Aguas Acuosas"),
      aguasNoAcuosas: calcularMaxMuestrasPosibles(stockDisponible, "Aguas no Acuosas")
    };

    return {
      "Ácido Nitrico": Math.max(0, stockDisponible["Ácido Nitrico"] - consumoSimulado.hno3),
      "Ácido clorhídrico": Math.max(0, stockDisponible["Ácido clorhídrico"] - consumoSimulado.hcl),
      "Peróxido de hidrógeno 30%": Math.max(0, stockDisponible["Peróxido de hidrógeno 30%"] - consumoSimulado.h2o2)
    };
  }, [stockDisponible, consumoSimulado]);

  const autonomiaCombinadaRestante = useMemo(() => {
    return {
      metales: calcularMaxMuestrasPosibles(stockRemanenteSimulado, "Metales Suelo"),
      oroPlata: calcularMaxMuestrasPosibles(stockRemanenteSimulado, "Oro y Plata"),
      aguasAcuosas: calcularMaxMuestrasPosibles(stockRemanenteSimulado, "Aguas Acuosas"),
      aguasNoAcuosas: calcularMaxMuestrasPosibles(stockRemanenteSimulado, "Aguas no Acuosas")
    };
  }, [stockRemanenteSimulado]);

  // PRESETS DEL SIMULADOR
  const aplicarPreset = (tipo) => {
    limpiarSimulador();
    setTimeout(() => {
      if (tipo === 'metales') {
        setSimMetalesSamples(autonomiaExclusiva.metales.muestras);
      } else if (tipo === 'oro_plata') {
        setSimOroPlataSamples(autonomiaExclusiva.oroPlata.muestras);
      } else if (tipo === 'aguas') {
        // Distribuimos equitativamente los remanentes entre aguas limpias y no acuosas
        setSimAguasAcuosasSamples(Math.floor(autonomiaExclusiva.aguasAcuosas.muestras / 2));
        setSimAguasNoAcuosasSamples(Math.floor(autonomiaExclusiva.aguasNoAcuosas.muestras / 2));
      }
    }, 10);
  };

  const limpiarSimulador = () => {
    setSimMetalesSamples(0);
    setSimOroPlataSamples(0);
    setSimAguasAcuosasSamples(0);
    setSimAguasNoAcuosasSamples(0);
  };

  // REGISTRO DE TRABAJOS REALES Y DESCUENTO DE STOCK DE BOTELLAS VIGENTES
  const handleRegistrarRun = (e) => {
    e.preventDefault();

    const qcRequired = calcularQCEscalonado(formSamples);
    const totalAnalysis = formSamples + qcRequired;

    let hno3Gasto = 0;
    let hclGasto = 0;
    let h2o2Gasto = 0;

    if (isCustomConsumption) {
      hno3Gasto = Number(customHno3);
      hclGasto = Number(customHcl);
      h2o2Gasto = Number(customH2o2);
    } else {
      const def = METODOS_DICCIONARIO[formMethod];
      hno3Gasto = def.con_hno3 * totalAnalysis;
      hclGasto = def.con_hcl * totalAnalysis;
      h2o2Gasto = def.con_h2o2 * totalAnalysis;
    }

    // Validar stock antes de la operación
    if (
      hno3Gasto > stockDisponible["Ácido Nitrico"] ||
      hclGasto > stockDisponible["Ácido clorhídrico"] ||
      h2o2Gasto > stockDisponible["Peróxido de hidrógeno 30%"]
    ) {
      triggerNotification("⚠️ No es posible registrar: El gasto calculado excede el stock disponible en bodega.", "error");
      return;
    }

    // Descontar del inventario físico (FIFO)
    setInventario(prevInv => {
      let remHno3 = hno3Gasto;
      let remHcl = hclGasto;
      let remH2o2 = h2o2Gasto;

      return prevInv.map(item => {
        if (item.state !== "Vigente") return item;
        let updateCurrent = item.currentVol;

        if (item.name === "Ácido Nitrico" && remHno3 > 0) {
          if (updateCurrent >= remHno3) {
            updateCurrent -= remHno3;
            remHno3 = 0;
          } else {
            remHno3 -= updateCurrent;
            updateCurrent = 0;
          }
        }
        if (item.name === "Ácido clorhídrico" && remHcl > 0) {
          if (updateCurrent >= remHcl) {
            updateCurrent -= remHcl;
            remHcl = 0;
          } else {
            remHcl -= updateCurrent;
            updateCurrent = 0;
          }
        }
        if (item.name === "Peróxido de hidrógeno 30%" && remH2o2 > 0) {
          if (updateCurrent >= remH2o2) {
            updateCurrent -= remH2o2;
            remH2o2 = 0;
          } else {
            remH2o2 -= updateCurrent;
            updateCurrent = 0;
          }
        }

        return { ...item, currentVol: updateCurrent };
      });
    });

    // Añadir al historial
    const nuevoRegistro = {
      id: Date.now(),
      date: formDate,
      method: formMethod,
      samples: Number(formSamples),
      qc: qcRequired,
      totalTests: totalAnalysis,
      hno3: hno3Gasto,
      hcl: hclGasto,
      h2o2: h2o2Gasto,
      notes: formNotes || "Registro manual de corrida"
    };

    setHistory(prev => [nuevoRegistro, ...prev]);

    // Limpieza
    setFormSamples(10);
    setFormNotes("");
    setIsCustomConsumption(false);
    setCustomHno3(0);
    setCustomHcl(0);
    setCustomH2o2(0);

    triggerNotification("🚀 Corrida de análisis registrada. El stock de frascos y las gráficas se actualizaron.", "success");
  };

  // REGISTRO DE PREPARACIÓN DE SOLUCIONES
  const handleRegistrarSolucion = (e) => {
    e.preventDefault();
    if (!solReactivo) {
      triggerNotification("⚠️ Por favor selecciona un reactivo.", "error");
      return;
    }

    const volNum = Number(solVolumen);
    if (volNum <= 0) {
      triggerNotification("⚠️ El volumen debe ser mayor a 0.", "error");
      return;
    }

    if (volNum > (stockDisponible[solReactivo] || 0)) {
      triggerNotification(`⚠️ No hay suficiente stock de ${solReactivo} para esta preparación.`, "error");
      return;
    }

    // Descontar del inventario físico (FIFO)
    setInventario(prevInv => {
      let remVol = volNum;
      return prevInv.map(item => {
        if (item.state !== "Vigente" || item.name !== solReactivo) return item;
        let updateCurrent = item.currentVol;
        if (remVol > 0) {
          if (updateCurrent >= remVol) {
            updateCurrent -= remVol;
            remVol = 0;
          } else {
            remVol -= updateCurrent;
            updateCurrent = 0;
          }
        }
        return { ...item, currentVol: updateCurrent };
      });
    });

    // Añadir al historial
    const nuevoRegistro = {
      id: Date.now(),
      date: solFecha,
      method: "Preparación de Solución",
      samples: "-",
      qc: "-",
      totalTests: "-",
      hno3: solReactivo === "Ácido Nitrico" ? volNum : 0,
      hcl: solReactivo === "Ácido clorhídrico" ? volNum : 0,
      h2o2: solReactivo === "Peróxido de hidrógeno 30%" ? volNum : 0,
      notes: `Preparación de solución de ${solReactivo} (${volNum} mL/g)`
    };

    setHistory(prev => [nuevoRegistro, ...prev]);
    setSolVolumen(100);
    triggerNotification("🧪 Gasto por preparación de solución registrado con éxito.", "success");
  };

  // AGREGAR NUEVO FRASCO AL INVENTARIO
  const handleAddNewReagent = (e) => {

    if (!newReagentLot) {
      triggerNotification("⚠️ Por favor ingresa el número de Lote del fabricante.", "error");
      return;

    const totalVolume = Number(newReagentVol) * Number(newReagentQty);
    const nuevoItem = {
      id: Date.now(),
      name: newReagentName,
      code: newReagentCode,
      brand: newReagentBrand,
      lot: newReagentLot,
      expiry: newReagentExpiry,
      unitVol: Number(newReagentVol),
      quantity: Number(newReagentQty),
      state: "Vigente",
      currentVol: totalVolume,
      initialVol: totalVolume
    };

    setInventario(prev => [...prev, nuevoItem]);
    setNewReagentLot("");
    triggerNotification(`📦 Añadidos ${newReagentQty} frascos de ${newReagentName} al stock general.`, "success");
  };

  // CAMBIAR ESTADO DE REACTIVOS
  const toggleReagentState = (id, newState) => {
    setInventario(prev => prev.map(item => {
      if (item.id === id) {
        const currentVol = newState === 'Agotado' ? 0 : item.initialVol;
        return { ...item, state: newState, currentVol };
      }
      return item;
    }));
    triggerNotification("🔧 Estado del frasco actualizado con éxito.", "success");
  };

  // ELIMINAR REGISTRO DE TRABAJO Y DEVOLVER REACTIVOS AL STOCK
  const handleDeleteLog = (log) => {
    setInventario(prevInv => {
      let remHno3 = log.hno3;
      let remHcl = log.hcl;
      let remH2o2 = log.h2o2;

      return prevInv.map(item => {
        if (item.state !== "Vigente") return item;
        let updateCurrent = item.currentVol;
        const maxCapacity = item.unitVol * item.quantity;

        if (item.name === "Ácido Nitrico" && remHno3 > 0) {
          const space = maxCapacity - updateCurrent;
          if (space >= remHno3) {
            updateCurrent += remHno3;
            remHno3 = 0;
          } else {
            remHno3 -= space;
            updateCurrent = maxCapacity;
          }
        }
        if (item.name === "Ácido clorhídrico" && remHcl > 0) {
          const space = maxCapacity - updateCurrent;
          if (space >= remHcl) {
            updateCurrent += remHcl;
            remHcl = 0;
          } else {
            remHcl -= space;
            updateCurrent = maxCapacity;
          }
        }
        if (item.name === "Peróxido de hidrógeno 30%" && remH2o2 > 0) {
          const space = maxCapacity - updateCurrent;
          if (space >= remH2o2) {
            updateCurrent += remH2o2;
            remH2o2 = 0;
          } else {
            remH2o2 -= space;
            updateCurrent = maxCapacity;
          }
        }

        return { ...item, currentVol: updateCurrent };
      });
    });

    setHistory(prev => prev.filter(item => item.id !== log.id));
    triggerNotification("🗑️ Registro de corrida eliminado. Los reactivos fueron repuestos en sus respectivos envases.", "success");
  };

  const triggerNotification = (msg, type = "success") => {

  // --- KPIs y Cálculos Ocupación ---
  const ocTotalHoras = useMemo(() => registrosLaboratorio.reduce((sum, item) => sum + item.horas, 0), [registrosLaboratorio]);
  const ocCursosUnicos = useMemo(() => new Set(registrosLaboratorio.map(item => item.curso)).size, [registrosLaboratorio]);
  
  const horasPorCurso = useMemo(() => {
    return registrosLaboratorio.reduce((acc, item) => {
      acc[item.curso] = (acc[item.curso] || 0) + item.horas;

  }, [registrosLaboratorio]);

  const horasPorDocente = useMemo(() => {

      return acc;
    }, {});
  }, [registrosLaboratorio]);

  const ocCursoTop = useMemo(() => {
    let top = '-';
    let max = 0;
    for (const [curso, horas] of Object.entries(horasPorCurso)) {
      if (horas > max) { max = horas; top = curso; }

  }, [horasPorCurso]);

  const handleRegistrarOcupacion = (e) => {
    e.preventDefault();
    if (!ocDocente || !ocCurso) {
      triggerNotification("⚠️ Seleccione docente y curso.", "error");

    const nuevoRegistro = {
      id: Date.now(),
      docente: ocDocente,
      curso: ocCurso,
      fecha: ocFecha,
      horas: Number(ocHoras)
    };
    setRegistrosLaboratorio(prev => [nuevoRegistro, ...prev]);
    setIsOcupacionModalOpen(false);
    setOcDocente("");
    setOcCurso("");
    setOcHoras(1);
    triggerNotification("Registro de ocupación agregado exitosamente.", "success");
  };

  const handleEliminarOcupacion = (id) => {
    setRegistrosLaboratorio(prev => prev.filter(reg => reg.id !== id));
    triggerNotification("Registro de ocupación eliminado.", "success");

  useEffect(() => {
    if (activeTab !== 'ocupacion') return;
    
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = '#64748b';

    let chartCursosInstance = null;
    let chartDocentesInstance = null;

    const ctxCursos = document.getElementById('chartCursos');
    const ctxDocentes = document.getElementById('chartDocentes');

    if (ctxCursos) {
      const labelsCursos = Object.keys(horasPorCurso);
      const dataCursos = Object.values(horasPorCurso);
      const bgCursos = labelsCursos.map(c => COLORES_CURSOS[c]?.bg || '#cbd5e1');
      const borderCursos = labelsCursos.map(c => COLORES_CURSOS[c]?.border || '#94a3b8');

      chartCursosInstance = new Chart(ctxCursos, {
        type: 'bar',
        data: {
          labels: labelsCursos,
          datasets: [{
            data: dataCursos,
            backgroundColor: bgCursos,
            borderColor: borderCursos,
            borderWidth: 1,
            borderRadius: 6,
            barThickness: 'flex',
            maxBarThickness: 50
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { borderDash: [4, 4], color: '#e2e8f0' } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    if (ctxDocentes) {
      const labelsDocentes = Object.keys(horasPorDocente);
      const dataDocentes = Object.values(horasPorDocente);
      const coloresDocentesList = labelsDocentes.map(d => COLORES_DOCENTES[d] || '#cbd5e1');

      chartDocentesInstance = new Chart(ctxDocentes, {
        type: 'doughnut',
        data: {
          labels: labelsDocentes,
          datasets: [{
            data: dataDocentes,
            backgroundColor: coloresDocentesList,
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '70%',
          plugins: { legend: { display: false } }
        }
      });
    }

    return () => {
      if (chartCursosInstance) chartCursosInstance.destroy();
      if (chartDocentesInstance) chartDocentesInstance.destroy();
    };
  }, [activeTab, horasPorCurso, horasPorDocente]);

  // CONSTRUCCIÓN DE LA CURVA CRONOLÓGICA DE DESCENSO
  const chartData = useMemo(() => {
    let runningHno3 = stockDisponible["Ácido Nitrico"];
    let runningHcl = stockDisponible["Ácido clorhídrico"];
    let runningH2o2 = stockDisponible["Peróxido de hidrógeno 30%"];

    const points = [];
    points.push({
      label: "Hoy",
      hno3: runningHno3,
      hcl: runningHcl,
      h2o2: runningH2o2
    });

    history.forEach(item => {
      runningHno3 += item.hno3;
      runningHcl += item.hcl;
      runningH2o2 += item.h2o2;
      points.push({
        label: item.date.slice(5),
        hno3: runningHno3,
        hcl: runningHcl,
        h2o2: runningH2o2
      });
    });

    return points.reverse();
  }, [history, stockDisponible]);

  // ALERTAS GENERALES DEL SISTEMA
  const alertasReactivos = useMemo(() => {
    const alertas = [];
    if (stockDisponible["Ácido Nitrico"] < 1500) {
      alertas.push({ type: "warning", message: `El nivel acumulado de Ácido Nítrico está por debajo de 1500 mL (${stockDisponible["Ácido Nitrico"]} mL restantes).` });
    }
    if (stockDisponible["Ácido clorhídrico"] < 1500) {
      alertas.push({ type: "warning", message: `El nivel acumulado de Ácido Clorhídrico está por debajo de 1500 mL (${stockDisponible["Ácido clorhídrico"]} mL restantes).` });
    }
    if (stockDisponible["Peróxido de hidrógeno 30%"] < 500) {
      alertas.push({ type: "warning", message: `El nivel acumulado de Peróxido de Hidrógeno está por debajo de 500 mL (${stockDisponible["Peróxido de hidrógeno 30%"]} mL restantes).` });
    }

    const vencidos = inventario.filter(i => i.state === "Vencido").length;
    if (vencidos > 0) {
      alertas.push({ type: "danger", message: `Atención: Se identificaron ${vencidos} estándares analíticos cuya fecha de validez ha expirado.` });
    }

    return alertas;
  }, [stockDisponible, inventario]);

  // Dibujado de Líneas de Tendencia SVG en Fondo Claro
  const renderSVGPath = (key, strokeColor, maxScale = 12000) => {
    if (chartData.length < 2) return null;
    const width = 500;
    const height = 200;
    const padding = 30;

    const points = chartData.map((d, index) => {
      const x = padding + (index / (chartData.length - 1)) * (width - padding * 2);
      const val = d[key] || 0;
      const y = height - padding - (val / maxScale) * (height - padding * 2);
      return `${x},${y}`;
    });

    return (
      <g>
        <path
          d={`M ${points.join(' L ')}`}
          fill="none"
          stroke={strokeColor}
          strokeWidth="3.5"
          strokeLinecap="round"
          className="transition-all duration-500 ease-in-out"
        />
        {chartData.map((d, index) => {
          const x = padding + (index / (chartData.length - 1)) * (width - padding * 2);
          const val = d[key] || 0;
          const y = height - padding - (val / maxScale) * (height - padding * 2);
          return (
            <g key={index} className="group cursor-pointer">
              <circle
                cx={x}
                cy={y}
                r="5.5"
                fill="#ffffff"
                stroke={strokeColor}
                strokeWidth="2.5"
                className="hover:r-7 transition-all duration-150"
              />
              <title>{`${d.label}: ${val} mL`}</title>
            </g>
          );
        })}
      </g>
    );
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans antialiased">
      
      {/* HEADER PRINCIPAL */}

          <div>

            </h1>

            </p>
          </div>
        </div>

        {/* NAVEGACIÓN EN PESTAÑAS (FONDOS CLAROS) */}
        <nav className="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200">
          <button
            onClick={() => setActiveTab('dashboard')}
            className={`flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-lg transition-all duration-150 ${
              activeTab === 'dashboard'
                ? 'bg-white text-indigo-600 shadow-sm'

            }`}
          >
            <Sliders className="w-4 h-4" />
            Planificador Dinámico
          </button>
          <button
            onClick={() => setActiveTab('registro')}
            className={`flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-lg transition-all duration-150 ${
              activeTab === 'registro'
                ? 'bg-white text-indigo-600 shadow-sm'
                : 'text-slate-600 hover:text-slate-900'
            }`}
          >
            <ClipboardList className="w-4 h-4" />
            Registro de gasto de reactivos
          </button>
          <button
            onClick={() => setActiveTab('inventario')}
            className={`flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-lg transition-all duration-150 ${
              activeTab === 'inventario'
                ? 'bg-white text-indigo-600 shadow-sm'
                : 'text-slate-600 hover:text-slate-900'

          >
            <Database className="w-4 h-4" />
            Inventario de Frascos ({inventario.length})
          </button>
          <button
            onClick={() => setActiveTab('ocupacion')}
            className={`flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-lg transition-all duration-150 ${

            }`}
          >
            <Users className="w-4 h-4" />

      {notification && (

          notification.type === 'success'

            : 'bg-white border-rose-200 text-rose-800 shadow-rose-100/40'
        }`}>
          <CheckCircle2 className={`w-5 h-5 flex-shrink-0 ${notification.type === 'success' ? 'text-emerald-500' : 'text-rose-500'}`} />
          <span className="text-sm font-semibold">{notification.text}</span>
        </div>
      )}

      {/* ALERTAS ACTIVAS */}
      {alertasReactivos.length > 0 && (
        <div className="bg-slate-50 px-6 pt-4">

            <div className="flex gap-3">
              <AlertTriangle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5 md:mt-0" />
              <div>
                <p className="text-sm font-bold text-amber-900">Advertencias de Seguridad y Stock</p>
                <div className="text-xs text-amber-800 mt-1 flex flex-wrap gap-x-4 gap-y-1">
                  {alertasReactivos.map((al, idx) => (
                    <span key={idx} className="flex items-center gap-1.5 font-medium">
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                      {al.message}
                    </span>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ÁREA DE CONTENIDO */}
      <main className="flex-1 p-6 max-w-7xl w-full mx-auto grid grid-cols-1 gap-6">

        {/* PESTAÑA 1: DASHBOARD / PLANIFICADOR INTERACTIVO */}
        {activeTab === 'dashboard' && (
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* PANEL DE SIMULACIÓN - IZQUIERDA */}
            <div className="lg:col-span-1 bg-white border border-slate-200 rounded-3xl p-6 flex flex-col gap-6 shadow-sm">
              <div>
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-extrabold text-slate-950 flex items-center gap-2">
                    <Sliders className="w-5 h-5 text-indigo-500" />
                    Simulador Estequiométrico
                  </h2>
                  <button 
                    onClick={limpiarSimulador}
                    className="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1 border border-slate-200 px-2.5 py-1.5 rounded-xl hover:bg-slate-50 transition"
                  >
                    <RefreshCw className="w-3.5 h-3.5" />
                    Limpiar
                  </button>
                </div>
                <p className="text-xs text-slate-500 mt-2 leading-relaxed">
                  Modifica las cantidades de muestras comerciales y observa cómo se añaden automáticamente los blancos y duplicados de control analítico.
                </p>
              </div>

              {/* CONTROLES DESLIZANTES PARA METODOLOGÍAS */}
              <div className="flex flex-col gap-5">

                                                <button onClick={() => handleEliminarOcupacion(item.id)} className="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100" title="Eliminar registro">
                                                    <Trash2 className="w-4 h-4" />
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })
                            )}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* Modal de Registro Ocupación */}
            {isOcupacionModalOpen && (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center animate-in fade-in duration-200">
                    <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-extrabold text-slate-900">Agregar Ingreso</h3>
                            <button onClick={() => setIsOcupacionModalOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors bg-slate-100 p-2 rounded-full">
                                <X className="w-5 h-5" />
                            </button>
                        </div>
                        
                        <form onSubmit={handleRegistrarOcupacion} className="flex flex-col gap-4">
                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-slate-700">Docente a cargo</label>
                                <select required value={ocDocente} onChange={e => setOcDocente(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold text-slate-800 outline-none focus:border-indigo-500 transition">
                                    <option value="" disabled>Seleccione un docente</option>
                                    <option value="Dr. Wilder Chuquiruna">Dr. Wilder Chuquiruna</option>
                                    <option value="M.Sc. Sandra Medina Paredes">M.Sc. Sandra Medina Paredes</option>
                                    <option value="M.Sc. Paul Aguilar">M.Sc. Paul Aguilar</option>
                                    <option value="M.Sc. Zoraida Remires">M.Sc. Zoraida Remires</option>
                                    <option value="M.Sc. Wilver Morales Cespedes">M.Sc. Wilver Morales Cespedes</option>
                                    <option value="Dr. Crispin zenon quispe mamani">Dr. Crispin zenon quispe mamani</option>
                                </select>
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-slate-700">Curso / Materia</label>
                                <select required value={ocCurso} onChange={e => setOcCurso(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold text-slate-800 outline-none focus:border-indigo-500 transition">
                                    <option value="" disabled>Seleccione un curso</option>
                                    <option value="Sedimentología">Sedimentología</option>
                                    <option value="Comportamiento de aguas superficiales">Comportamiento de aguas superficiales</option>
                                    <option value="Geología Ambiental">Geología Ambiental</option>
                                    <option value="Química General">Química General</option>
                                    <option value="Química Analítica">Química Analítica</option>
                                    <option value="Mineralogía y Petrología">Mineralogía y Petrología</option>
                                    <option value="Evaluación de Impacto Ambiental">Evaluación de Impacto Ambiental</option>
                                    <option value="Geohidrología">Geohidrología</option>
                                    <option value="Geoestadística">Geoestadística</option>
                                </select>
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-slate-700">Fecha del ingreso</label>
                                <input type="date" required value={ocFecha} onChange={e => setOcFecha(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold text-slate-800 outline-none focus:border-indigo-500 transition" />
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-xs font-bold text-slate-700">Horas de uso continuo</label>
                                <input type="number" required min="1" max="24" value={ocHoras} onChange={e => setOcHoras(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold font-mono text-slate-800 outline-none focus:border-indigo-500 transition" />
                            </div>

                            <div className="pt-4 flex gap-3">
                                <button type="button" onClick={() => setIsOcupacionModalOpen(false)} className="flex-1 px-4 py-3 border border-slate-300 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-50 transition-colors">
                                    Cancelar
                                </button>
                                <button type="submit" className="flex-1 px-4 py-3 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 transition-colors shadow-sm">
                                    Guardar Registro
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            )}
          </div>
        )}

      </main>

      {/* FOOTER */}
      <footer className="bg-white border-t border-slate-200 p-6 text-center text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-4 mt-auto">
        <div>
          <span>© 2026 TraceLabs Inc. Licencia Química Certificada.</span>
        </div>
        <div className="flex gap-4 font-bold">
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Conectado a Core</span>
          <span className="flex items-center gap-1 text-indigo-600"><Sparkles className="w-3.5 h-3.5" /> Antigravity Compliant</span>
        </div>
      </footer>
    </div>
  );
}

        // Renderizado de la aplicación en el DOM
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
